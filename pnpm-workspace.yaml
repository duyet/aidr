packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true
  "@clerk/shared": true
  sharp: true
  bufferutil: true
  utf-8-validate: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@tanstack/*"
  # Enumerate the @clerk/* packages that pnpm-lock.yaml actually resolves
  # instead of a blanket scope, so every other package (including any future
  # @clerk/* release) stays behind `minimumReleaseAge`. All four are published
  # from the single clerk/javascript monorepo and only ship together, so
  # excluding them individually still lets Renovate's `--no-save` artifact
  # step advance the whole set. Keep in sync with
  # `grep -oE "@clerk/[a-z-]+@[0-9.]+" pnpm-lock.yaml | sort -u`.
  - "@clerk/tanstack-react-start"
  - "@clerk/backend"
  - "@clerk/react"
  - "@clerk/shared"
  - cn
  - wrangler
  - cf
  - "@cloudflare/codemods"
  - workerd
  - miniflare
  - "@cloudflare/workerd-*"
  - "@cloudflare/workers-types"
  # cf 1.0.0-beta.x deps published in lockstep with cf itself.
  - "@cloudflare/config"
  - "@cloudflare/build-output-utils"
  # motion 14.x pulls these in transitively; all four ship from the single
  # motiondivision/motion monorepo and are released together, so enumerating
  # them keeps every other package behind `minimumReleaseAge`. Keep in sync
  # with `grep -oE "^  (framer-)?motion[a-z-]*@[0-9.]+" pnpm-lock.yaml`.
  - motion
  - framer-motion
  - motion-dom
  - motion-utils

nodeLinker: hoisted
shamefullyHoist: true
linkWorkspacePackages: true
