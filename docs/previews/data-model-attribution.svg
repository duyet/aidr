<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">AIDR Pipeline model attribution preview</title>
  <desc id="desc">A design preview showing score, translate, TL;DR, and decisions model cards plus a separate AIDR user signups card.</desc>
  <rect width="1440" height="500" fill="#f7f7f5"/>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .muted { fill: #6b6b6b; }
    .fg { fill: #0a0a0a; }
    .accent { fill: #b45309; }
    .border { stroke: #dededb; stroke-width: 1; }
  </style>
  <text x="48" y="48" class="sans fg" font-size="22" font-weight="700">Pipeline</text>
  <text x="48" y="70" class="sans muted" font-size="12">Live ingest, content, and token use.</text>

  <rect x="48" y="96" width="1040" height="292" rx="16" fill="#fff" class="border"/>
  <text x="72" y="132" class="sans fg" font-size="15" font-weight="700">Powered by AnyRouter</text>
  <text x="72" y="151" class="sans muted" font-size="10">Lead model + fallback depth · public config only</text>
  <text x="930" y="132" class="sans accent" font-size="11" font-weight="600">Explore AnyRouter ↗</text>

  <g>
    <rect x="72" y="172" width="238" height="88" rx="10" fill="#f1f1ef" class="border"/>
    <circle cx="91" cy="193" r="7" fill="#f3e2c9"/><path d="M88 193l2 2 4-5" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <text x="105" y="197" class="sans muted" font-size="10" font-weight="700" letter-spacing="1">SCORE</text>
    <rect x="252" y="183" width="43" height="18" rx="9" fill="#fff" class="border"/><text x="261" y="196" class="sans muted" font-size="9">4 hops</text>
    <text x="88" y="226" class="mono fg" font-size="12">typesafe/jev</text>
    <text x="88" y="245" class="sans muted" font-size="10">4 fallbacks after lead</text>
  </g>
  <g>
    <rect x="322" y="172" width="238" height="88" rx="10" fill="#f1f1ef" class="border"/>
    <circle cx="341" cy="193" r="7" fill="#f3e2c9"/><text x="338" y="196" class="sans accent" font-size="8" font-weight="700">文</text>
    <text x="355" y="197" class="sans muted" font-size="10" font-weight="700" letter-spacing="1">TRANSLATE</text>
    <rect x="502" y="183" width="43" height="18" rx="9" fill="#fff" class="border"/><text x="511" y="196" class="sans muted" font-size="9">4 hops</text>
    <text x="338" y="226" class="mono fg" font-size="12">google/gemini-3.5-flash</text>
    <text x="338" y="245" class="sans muted" font-size="10">4 fallbacks after lead</text>
  </g>
  <g>
    <rect x="572" y="172" width="238" height="88" rx="10" fill="#f1f1ef" class="border"/>
    <circle cx="591" cy="193" r="7" fill="#f3e2c9"/><path d="M588 190h6M588 193h6M588 196h4" stroke="#b45309" stroke-width="1.3"/>
    <text x="605" y="197" class="sans muted" font-size="10" font-weight="700" letter-spacing="1">TL;DR</text>
    <rect x="752" y="183" width="43" height="18" rx="9" fill="#fff" class="border"/><text x="761" y="196" class="sans muted" font-size="9">3 hops</text>
    <text x="588" y="226" class="mono fg" font-size="12">anyrouter/auto</text>
    <text x="588" y="245" class="sans muted" font-size="10">3 fallbacks after lead</text>
  </g>
  <g>
    <rect x="822" y="172" width="242" height="88" rx="10" fill="#f1f1ef" class="border"/>
    <circle cx="841" cy="193" r="7" fill="#f3e2c9"/><path d="M837 193h8M841 189v8" stroke="#b45309" stroke-width="1.3"/>
    <text x="855" y="197" class="sans muted" font-size="10" font-weight="700" letter-spacing="1">DECISIONS</text>
    <rect x="1006" y="183" width="43" height="18" rx="9" fill="#fff" class="border"/><text x="1015" y="196" class="sans muted" font-size="9">4 hops</text>
    <text x="838" y="226" class="mono fg" font-size="12">typesafe/jev</text>
    <text x="838" y="245" class="sans muted" font-size="10">4 fallbacks after lead</text>
  </g>
  <text x="72" y="294" class="sans muted" font-size="10">Fallback names remain available from each model link and in Algo; no keys or prompt data are rendered.</text>

  <rect x="1104" y="96" width="288" height="292" rx="16" fill="#fff" class="border"/>
  <rect x="1128" y="124" width="30" height="30" rx="9" fill="#f1f1ef"/>
  <circle cx="1143" cy="136" r="5" fill="none" stroke="#b45309" stroke-width="1.5"/><path d="M1135 149c1-6 15-6 16 0" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="1170" y="136" class="sans fg" font-size="12" font-weight="700">AIDR user signups</text>
  <text x="1170" y="153" class="sans muted" font-size="10">Clerk accounts · aggregate total</text>
  <text x="1128" y="246" class="mono fg" font-size="42" font-weight="700">37</text>
  <text x="1128" y="274" class="sans muted" font-size="10">Preview fixture · live value is read server-side</text>
  <line x1="1128" y1="300" x2="1368" y2="300" stroke="#dededb"/>
  <text x="1128" y="326" class="sans muted" font-size="10">D1 subscribers stay separate:</text>
  <text x="1128" y="344" class="sans fg" font-size="10">email subscriptions ≠ accounts</text>

  <rect x="48" y="424" width="1344" height="42" rx="10" fill="#fffaf0" class="border"/>
  <text x="68" y="450" class="sans muted" font-size="11">Design preview · generated from the current model configuration; unavailable account sources render as “Unavailable”, never 0.</text>
</svg>
