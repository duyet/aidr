name = "aidr"
account_id = "18bb51bef63a88086717388ed7f3008e"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Enable versioned preview URLs (<version>-aidr.<subdomain>.workers.dev)
# Config stays TOML. `cf migrate` (cf 1.0.0-beta.5) drops Workflow and
# Durable Object bindings, which the hourly ingest needs. Deploy with
# `wrangler deploy`. Use `cf` for D1 and Worker secrets.
preview_urls = true

[assets]
directory = "dist/client"
binding = "ASSETS"
# `/` must hit the Worker so the homepage SSR's stories (the static
# index.html shell has no feed). Sitemap/robots/RSS/news are Worker-generated
# too: /sitemap.xml is now a sitemap index whose /sitemaps/* children,
# /news.xml, and /feed.xml must never fall through to the SPA shell.
# Logo/og/favicon also run Worker-first so we can ASSETS.fetch them with
# a real image/* type instead of SPA HTML (mail + Gmail need PNG 200).
# `/_serverFn` is pinned Worker-first for the same reason: it is the RPC
# transport, so the Worker must be the one that decides whether a path names a
# real server function. This is explicitness, not the fix — a non-navigation
# request to a non-asset path already reaches the Worker, and the array form
# above already disables `assets_navigation_prefers_asset_serving`. The bounded
# JSON 404 lives in `server.ts` (`classifyServerFnPath`), not here.
# Every icon surface is listed too: search engines each pick their own file, and
# every one of them has to answer with an image rather than the SPA shell.
run_worker_first = ["/", "/favicon.ico", "/logo-sm.png", "/logo.png", "/logo-icon.png", "/logo.svg", "/og.jpg", "/favicon.svg", "/favicon-120x120.png", "/apple-touch-icon.png", "/sitemap.xml", "/sitemaps/*", "/news.xml", "/feed.xml", "/rss.xml", "/feed.json", "/robots.txt", "/llms.txt", "/auth.md", "/about.md", "/subscribe.md", "/data.md", "/brand.md", "/release.md", "/privacy.md", "/terms.md", "/mcp.md", "/contribute.md", "/openapi.json", "/.well-known/*", "/api/*", "/__clerk/*", "/_serverFn", "/_serverFn/*", "/aidr.zip"]
not_found_handling = "single-page-application"

# Ingest every 30 minutes is a Durable Object alarm (`NewsIngestScheduler`) plus
# GitHub Actions (`.github/workflows/ingest.yml`) as a watchdog.
# account_id above is public (Account ID). Zone ID for aidr.today DNS is
# documented in the repo README (not in .env.example).
# Do not add Worker `[triggers] crons` (Free 5-cron cap breaks deploy)
# and do not add Workflow `schedules` (paid Workers plan — wrangler
# deploy exits 1). Manual: Actions workflow_dispatch, admin
# POST /api/admin/ingest, or `wrangler workflows trigger news-ingest`.

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

# Not a cron trigger. A 30-minute `alarm()` starts NewsIngestWorkflow without
# counting against the account's 5 Worker cron slots.
[durable_objects]
bindings = [
  { name = "NEWS_INGEST_SCHEDULER", class_name = "NewsIngestScheduler" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NewsIngestScheduler"]

# WebP → JPEG for OG card photos (resvg cannot draw WebP).
[images]
binding = "IMAGES"

# Rendered OG PNGs shared across every region (src/lib/og-cache.ts).
[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "aidr-og"

# Homepage HTML shared across colos (src/lib/global-html-cache.ts). Keyed by
# the deployed version id, so a copy never names another build's chunks.
# Create the namespace, then paste its id here before deploying.
[[kv_namespaces]]
binding = "HTML_CACHE"
id = "de22f7aaa8434ed894978d6bf2b9f7a1"

[version_metadata]
binding = "CF_VERSION_METADATA"

# POST /api/read: one count per (IP, story, kind) a minute, the longest
# period the binding allows. aidr stores nothing; Cloudflare keeps the
# per-location counter.
# namespace_id must be unique on the account.
[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "8220"

  [ratelimits.simple]
  limit = 1
  period = 60

# USAGE (src/lib/usage.ts) is off until Analytics Engine is enabled on this
# account (deploy fails with error 10089). Re-add when it is:
# [[analytics_engine_datasets]]
# binding = "USAGE"
# dataset = "aidr_usage"

[[d1_databases]]
binding = "DB"
database_name = "aidr"
database_id = "7ec0478c-d9b0-4d55-8812-c0bd37409b32"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
# Chat chains, picked by a streaming probe (2026-10-01 recheck): stream:true
# with response_format json_object, our headers, real prompts (3-item
# translate batch ~9.4K chars from prod items; review on prod pairs).
# Time to first token / total (resolved id):
#   poolside/laguna-s-2.1    6-8s / 55-60s big translate, 3 of 3 (one with a
#                            stray closer, parseJson repairs it); 5s / 6-12s
#                            small; accepts provider.require_parameters, so it
#                            does honour response_format on this key
#   @preset/aidr             then resolved to stealth/space-bunny-alpha: big
#                            translate 0 of 4 (reasoning eats max_tokens,
#                            finish_reason length, no content); prod ~4.5K
#                            translate 8 of 8 ok, ~7K and TL;DR time out at 20s
#   anyrouter/auto           502 upstream_exhausted or nemotron-3-ultra with a
#                            29-66s first token; prod translate 0 of 8. Off
#                            every chain since 2026-10-16: served 0 of 97
#                            calls in the 7 days before (cluster 0/48, score
#                            0/41), and its slot cut Claude Sonnet to 18s
#                            after a stalled cluster head (#672).
#   google/gemini-3-flash    2026-10-04 streaming json_object: HTTP 200, usable
#                            vi JSON in 2-6s. Off every chain since
#                            2026-10-14: 0 of 21 since 00:00 UTC (404, 502).
#                            Re-probe before adding it back (#663).
#   google/gemma-latest      2026-10-10 rolling alias → gemma-4-31b (paid
#                            route). Streaming json_object via the prod
#                            client (cluster-gold-eval): 2 of 2 and 3 of 3,
#                            p50 10-16s on the 96-title cluster prompt.
#   nvidia/nemotron-3.5-bolt-e4b 2026-10-25 (free). Streaming json_object
#                            via the prod client (translation-eval gen, 3-item
#                            translate): 7 of 12 batches, call p50 12s;
#                            5 batches 502 or time out at 35s on every try.
#   z-ai/glm-latest          2026-10-10 rolling alias → glm-5.2. Cluster 2 of
#                            2, p50 7.6s. glm-flash-latest (→ glm-4.7-flash)
#                            writes reasoning prose before JSON: not used.
#   openai/gpt-5.6-luna      2026-10-10: no longer BYOK-only on this key.
#                            TL;DR 3 of 3, p50 37s; cluster 3 of 3, p50 4.4s.
#   anthropic/claude-sonnet-5-5 2026-10-15: no longer BYOK-only on this key.
#                            1-token probes HTTP 200 for claude-sonnet-5-5,
#                            -5 and claude-sonnet-latest (served 5-5), no
#                            streaming json_object probe on a real prompt
#                            yet. Rejects temperature (llm.ts omits it for
#                            anthropic/ ids). Paid, $2/$10 per 1M list, so
#                            last on ANYROUTER_MODEL only.
#   Not usable on this key 2026-10-10 (404 BYOK-only): gemini-flash-latest
#   (→ gemini-3.8-flash), gemini-pro-latest (→ gemini-3.1-pro),
#   qwen-flash-latest, claude-haiku-latest. claude-sonnet-latest was too,
#   until 2026-10-15.
#   deepseek-flash-latest (→ deepseek-v4-flash) answers small prompts but
#   sent no token within 20s on the cluster prompt.
#   google/gemma-4-31b       catalog id; OpenRouter wire google/gemma-4-31b-it:free.
#                            Removed 2026-10-14: no success since 10-12 03:16
#                            UTC (#663).
#   google/gemma-4-26b-a4b-it catalog id; OpenRouter :free BYOK hop. VI
#                            translate only, after Gemini 3 Flash and Gemma 31B.
# Laguna often emits one stray `]`/`}`; parseJson drops it (llm.ts).
# Removed 2026-10-01: anyrouter/free (dots-3-note-preview, reasoning-only on
# big prompts, prod translate 0 of 8), anyrouter/latest (space-bunny, same
# as the preset). Earlier: meta/muse-glimmer-30b (34s first token, 60s hang,
# 502), anyrouter/cowork (empty content 2 of 3). nvidia/nemotron-3-120b-a12b
# and -super never stream a token; -ultra buffers 56-140s;
# deepseek-v4.1-flash, minimax/m3 fail.
# BYOK-only on this key (404 "model_unavailable"): openai/*, qwen/*,
# google/* other than gemini-3-flash and the two Gemma translate ids above, meta/llama-*,
# meta/muse-spark-*, mistralai/*, moonshotai/*,
# x-ai/*, minimax/m2.*, cohere/*, nex-agi/*, bytedance-seed/*, upstage/*,
# xiaomi/*, stepfun-ai/*, tencent/*, ibm-granite/*, sakana/*, openrouter/free.
# Score tries ANYROUTER_DECISION_MODEL (when set), then Jev
# (ANYROUTER_JEV_MODEL), then ANYROUTER_MODEL.
# 2026-10-10: cluster gold eval (scripts/cluster-gold-eval.ts, 96-row 24h
# pool, 3 reps): laguna-s-2.1 F1 0.51 (17 false merges, missed 8 pairs);
# gemma-4-31b, glm-5.2, gpt-5.6-luna and @preset/aidr 1.0. Score bench
# (gold band hit): gemma 0.60, laguna 0.20. Rolling aliases probed here:
# google/gemma-latest → gemma-4-31b, z-ai/glm-latest → glm-5.2.
# @preset/aidr now serves gemma-4-31b; anyrouter/auto serves laguna.
# Claude Sonnet 5.5 is the paid last resort (2026-10-15). Over the 7 days
# before, 100 calls reached anyrouter/auto (cluster 50, score 46, other 4)
# and it served none; 25 of them were the 10-13 account-wide 429 window.
# 2026-10-16: anyrouter/auto dropped (#672). When the cluster head stalls
# for its 45s slice, Sonnet now gets 35s instead of 18s.
# Translate, summarize and TL;DR stay off Sonnet: see those chains.
ANYROUTER_MODEL = "google/gemma-latest,z-ai/glm-latest,@preset/aidr,anthropic/claude-sonnet-5-5"
# Translate tries Laguna first, then gemma-latest. Each extra id still
# reserves a 20s fallback slice
# (2026-10-02). Dropped @preset/aidr (11/87 ok over 24h,
# 44 rate-limited) and anyrouter/auto (prod translate 0 of 8).
# gemma-latest (30/30 served, fidelity 0.944 in the 2026-10-10 bake-off)
# before the gemma-4-31b :free route, kept until duyet/anyrouter#4798.
# 2026-10-11 (llm_calls, 7d, translate ok/n): gemini-3-flash 819/1035,
# laguna 73/185, gemma-4-31b 110/366 (213 timeouts), gemma-4-26b 35/148
# (103 timeouts, dropped). Laguna moved ahead of 31b. gemma-latest stays
# second: summarize uses this chain and it served 20/20 there while
# gemini-3-flash 502d 21/21.
# 2026-10-14 (#663, translate and summarize ok/n since 00:00 UTC, 429s
# excluded): laguna 19/22, gemma-latest 22/44, gemini-3-flash 0/21 (404,
# 502), gemma-4-31b 0/3 and nothing since 10-12. Laguna summarize 772/987
# over 7d. Gemini is not kept as a tail: a 502 is never skipped, and a
# third id cuts the head's slice in the 70s batch from 50s to 30s, under
# Laguna's 32.5s translate p95. Claude Sonnet stays off for the same reason.
# 2026-10-25 (#1056): gemma-latest went 0/22 on translate. NVIDIA
# Nemotron 3.5 Bolt E4B (free) replaces it as the fallback. Eval on the
# vi-natural set (36 stories, 12 batches): it served 7 of 12 full batches
# (the other 5 returned a 502 or timed out on all 3 tries), at a call p50
# of 12s against Laguna's 28s. On those 7 batches, two blind judges
# preferred its Vietnamese (more natural 32 of 42, more faithful 25 of 42;
# lost facts 36 against 68), with no draft-check issues. It stays second
# because of those 5 batches. Two ids keep Laguna's slice.
ANYROUTER_TRANSLATE_MODEL = "poolside/laguna-s-2.1,nvidia/nemotron-3.5-bolt-e4b"
# TL;DR keeps two ids: every extra id reserves a 20s fallback slice out of
# the first hop's budget, and Laguna needs 102-119s on the 26K VI prompt.
# 2026-10-10 tldr bench (3 cases): gpt-5.6-luna quality 1.0, p50 37s,
# ~$0.005/run; laguna 0.973, p50 99s.
# 2026-10-11: anyrouter/auto 0/26 on tldr over 7d (22 timeouts); replaced
# by gemini-3-flash (tldr 3/3 at ~4s, translate 819/1035).
# 2026-10-14 (#663): gemini-3-flash served 1 of 6 tldr fallback attempts
# over 7d, then went dead. Laguna replaces it (tldr 21/32 attempts, p95
# 105s). After a 20s luna first-token hang, Laguna gets a 135s slice.
# No Claude Sonnet tail: a third id cuts luna's slice on the EN-only retry
# from 40s to 20s when the first attempt used its 170s (luna p50 37s).
ANYROUTER_TLDR_MODEL = "openai/gpt-5.6-luna,poolside/laguna-s-2.1"
# Explicit generator for the real VI→EN candidate path; source language is
# persisted as metadata and never inferred by the reviewer. Concrete ids only
# (router aliases and presets are filtered out of this chain). Same order
# as ANYROUTER_TRANSLATE_MODEL (#663). The 26B id stays off this chain.
# resolveEnglishGeneratorChain keeps the first 2 ids, so a third id (such
# as Claude Sonnet) would be dropped without a warning.
ANYROUTER_ENGLISH_TRANSLATE_MODEL = "poolside/laguna-s-2.1,google/gemma-latest"
# Translation semantic review: explicit concrete ids, disjoint from every
# generator id; missing/overlapping config fails closed. Max 2 ids.
# Review probe on 3 prod pairs with provider.require_parameters (first
# token / total, valid v2 JSON):
#   z-ai/glm-4.6                      9-10s / 11-12s, 3 of 3; prod route
#                                     column records upstream glm-5.3-flash
#   z-ai/glm-5.2                      10s / 11-12s, 3 of 3
#   stealth/space-bunny-alpha         15s total, 1 of 3 inside the 30s
#                                     slice (2026-10-02 requestReview);
#                                     removed 2026-10-14, 0 of 484 in prod
# Removed: inclusionai/ling-3.0-flash-sante (no response_format: 404
# unsupported_parameters under require_parameters; prod invalid_response 5 of
# 5 at the 1024-token cap). z-ai/glm-5.3-flash and z-ai/glm-4.5 502
# upstream_exhausted 3 of 3. (space-bunny was dropped earlier for 13s first
# token and reasoning-only 1 of 3.)
# 2026-10-02: the 7-day review_failed spike (364x 404) came from the old
# grok-4.7 / glm-5.3-flash / llama-3.3 chains (09-25..10-01). glm-4.6 then
# reviewed 64/71 ok in prod until 08:31 UTC; from ~08:40 every z-ai id
# (4.6, 4.7, 5.1, 5.2, glm-latest) returns 404 model_unavailable (BYOK-only)
# on this key. Probed requestReview on 3-4 fixture pairs: space-bunny-alpha
# 1/3 in the 30s slice (others time out); deepseek-v4.1-flash 404;
# laguna-xs-2.1 invalid JSON 4/4; ling-3.0-flash-sante fails accept 3/4;
# longcat-2.5-preview and nemotron-3.5-lightning time out 4/4.
# 2026-10-14 (#655, prod llm_calls, review ok/n): space-bunny-alpha 0/484
# over 7d (404, timeouts), removed. glm-4.6 866/1425 over 7d but 12/259 in
# the last 24h; its failures average 16.5s (timeouts, 502). No probed id is
# healthy, so review is paused below and glm-4.6 stays as the chain a probe
# starts from. gpt-5.6-luna is not a candidate while it heads
# ANYROUTER_TLDR_MODEL: 27% of its tldr attempts never sent a first token,
# and the per-run timeout breaker and 429 skip map are keyed by model, not
# task, so review hangs would push TL;DR onto its fallback (#663).
ANYROUTER_REVIEW_MODEL = "z-ai/glm-4.6"
# Translation review (qa-translations) is post-hoc QA: translations publish
# at translate time and no site, email or Telegram read waits on qa_* columns.
# "false" stops every review and repair call (406 of 413 failed on 10-13, all
# on the shared quota, #655); VI→EN candidates are still created. Re-enable
# once a reviewer is chosen by a measured probe on review prompts, which
# needs ANYROUTER_LOCAL_API_KEY (#656).
TRANSLATION_REVIEW_ENABLED = "false"
# Freshness check (ALGORITHM.md "Freshness check"): "shadow" checks the top
# stories' article dates and HN coverage and stores verdicts in
# story_freshness; ranking ignores them. Any other value skips the step.
# FIRECRAWL_API_KEY (Worker secret) adds Firecrawl search when set.
FRESHNESS_CHECK = "shadow"
# Canonical catalog id typesafe/jev (upstream alias jev-latest). System One
# only: score judgments and review gates try it first; the chat chain above
# is the backup. BYOK-only — Dashboard → BYOK → TypeSafe. Never add this id
# to a /chat/completions chain; Jev is rejected there.
ANYROUTER_JEV_MODEL = "typesafe/jev"
# Optional System One router tried before Jev on score. Empty = score starts
# at Jev. Off since 2026-10-16 (#854): over 7 days anyrouter/decision served
# Jev on 66 of 1546 answers; the rest came from experiential-byok jev-latest
# or hal-x THX-01, were rejected by servedByJev, and each cost a second Jev
# call. Its outages matched Jev's, so it never covered for Jev. Turn it back
# on only after the bench (decision step, --models anyrouter/decision) shows
# it serving Jev.
ANYROUTER_DECISION_MODEL = ""
# Derived from VITE_CLERK_PUBLISHABLE_KEY's base64 domain suffix, then
# overridden to the /__clerk Worker proxy (Cloudflare Error 1000/1014
# blocks the clerk.aidr.today CNAME onto Clerk's CF-hosted FAPI).
CLERK_ISSUER = "https://aidr.today/__clerk"
# Single canonical public proxy URL shared by the Worker and browser build.
# HTTPS is required; HTTP is allowed only for explicit loopback development.
# Vite derives its browser value from this variable; never configure a
# separate VITE_CLERK_PROXY_URL or derive this from request Host.
# Before rollout, configure the edge WAF rate-limit rule documented in
# worker/README.md for /__clerk/*; no per-isolate limiter is used here.
# The handler's documented request/response body limit is 1 MiB.
CLERK_PROXY_URL = "https://aidr.today/__clerk"
CLERK_PROXY_TIMEOUT_MS = "10000"
# @duyetbot posts each language to its own chat. TELEGRAM_BOT_TOKEN is a secret.
# TELEGRAM_CHAT_ID is the old Vietnamese name; the Worker reads these two.
TELEGRAM_VI_CHAT_ID = "-1004420104760"
TELEGRAM_EN_CHAT_ID = "@aidr_today"
# Facebook Page posting is off until FACEBOOK_PAGE_ID and
# FACEBOOK_PAGE_ACCESS_TOKEN are set. The app id and secret only mint a
# replacement token. All four live in .env.local. Do not commit them.
# `pnpm facebook:mint` writes the Page token. `pnpm sync-env` uploads the
# secrets and skips a name that is still a [vars] binding.
# GA4 property read by the Worker for the /data Audience tab (page views,
# DAU, MAU). Public config, not a secret — the credential that actually
# authorises the read is the GA4_SERVICE_ACCOUNT_JSON secret. With either one
# missing the Audience tab reports "Unavailable" instead of a zero audience.
GA4_PROPERTY_ID = ""
# Cloudflare Email Sending. Onboard aidr.today (`wrangler email sending enable aidr.today`)
# then these From addresses can deliver. Override with EMAIL_FROM / EMAIL_NOTES_FROM.
EMAIL_FROM = "digest@aidr.today"
EMAIL_NOTES_FROM = "notes@aidr.today"
EMAIL_FROM_NAME = "AI;DR"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["digest@aidr.today", "notes@aidr.today"]

# Workers Cache: safe for this surface — only responses with public
# Cache-Control headers (homepage, feed/story/public APIs, sitemap,
# fingerprinted /assets/*) are cached; /api/system and /api/system/* carry
# public TTLs (30s browser / 120s edge / 10min swr) and the aggregate
# /api/system pins D1 first-primary so lastRun recert reads fresh primary
# state between cache hits; admin/subscribe/suggest/submit/mcp set no-store
# and Authorization-bearing requests auto-bypass. Public GET /api/public is
# Cache-Control: public.
[cache]
enabled = true

[observability]
enabled = true

[[routes]]
pattern = "aidr.today"
custom_domain = true

# Do not attach news.duyet.net here — different Cloudflare account.
# monorepo / duyet.net owns the path-preserving redirect.
