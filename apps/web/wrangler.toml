name = "aidr"
account_id = "7df185a18b98382c3240fa7ac4a37075"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
# Enable versioned preview URLs (<version>-aidr.<subdomain>.workers.dev)
# so `wrangler versions upload` yields a shareable preview before prod deploy.
preview_urls = true

[assets]
directory = "dist/client"
binding = "ASSETS"
# `/` must hit the Worker so the homepage SSR's stories (the static
# index.html shell has no feed). Sitemap/robots are Worker-generated.
# Logo/og/favicon also run Worker-first so we can ASSETS.fetch them with
# a real image/* type instead of SPA HTML (mail + Gmail need PNG 200).
run_worker_first = ["/", "/logo-sm.png", "/logo.png", "/logo-icon.png", "/logo.svg", "/og.jpg", "/favicon.svg", "/sitemap.xml", "/robots.txt", "/llms.txt", "/auth.md", "/openapi.json", "/.well-known/*", "/api/*", "/__clerk/*", "/aidr.zip"]
not_found_handling = "single-page-application"

# Hourly ingest is a Durable Object alarm (`NewsIngestScheduler`) plus
# GitHub Actions (`.github/workflows/ingest.yml`) as a watchdog.
# account_id above is public (Account ID). Zone ID for aidr.today DNS is
# documented in the repo README (not in .env.example).
# Do not add Worker `[triggers] crons` (Free 5-cron cap breaks deploy)
# and do not add Workflow `schedules` (paid Workers plan — wrangler
# deploy exits 1). Manual: Actions workflow_dispatch, admin
# POST /api/admin/ingest, or `wrangler workflows trigger news-ingest`.

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

# Not a cron trigger. Hourly `alarm()` starts NewsIngestWorkflow without
# counting against the account's 5 Worker cron slots.
[durable_objects]
bindings = [
  { name = "NEWS_INGEST_SCHEDULER", class_name = "NewsIngestScheduler" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NewsIngestScheduler"]

[[d1_databases]]
binding = "DB"
database_name = "aidr"
database_id = "0c8f3efe-0427-4268-8d9f-bb1a4bcbe427"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
# Auto first, then DeepSeek V4.1 flash / Laguna S 2.1 / MiniMax M3.
# Same chain for score, translate, and TL;DR. Avoid ling-3.0-flash (404)
# and Gemma/GLM flash (502). stealth/ox-alpha stays delisted. No BYOK-only
# ids (SEA-LION, gemini-3.6/3.7, qwen3.7).
ANYROUTER_MODEL = "anyrouter/auto,deepseek/deepseek-v4.1-flash,poolside/laguna-s-2.1,minimax/m3"
ANYROUTER_TRANSLATE_MODEL = "anyrouter/auto,deepseek/deepseek-v4.1-flash,poolside/laguna-s-2.1,minimax/m3"
ANYROUTER_TLDR_MODEL = "anyrouter/auto,deepseek/deepseek-v4.1-flash,poolside/laguna-s-2.1,minimax/m3"
# Derived from VITE_CLERK_PUBLISHABLE_KEY's base64 domain suffix, then
# overridden to the /__clerk Worker proxy (Cloudflare Error 1000/1014
# blocks the clerk.aidr.today CNAME onto Clerk's CF-hosted FAPI).
CLERK_ISSUER = "https://aidr.today/__clerk"
# Server-side clerkMiddleware + Vite public env. Relative path is resolved
# against the request origin so handshakes hit /__clerk, not clerk.aidr.today.
CLERK_PROXY_URL = "/__clerk"
VITE_CLERK_PROXY_URL = "/__clerk"
# @duyetbot posts top stories to this channel; TELEGRAM_BOT_TOKEN is a secret.
TELEGRAM_CHAT_ID = "-1004420104760"
# Cloudflare Email Sending. Onboard aidr.today (`wrangler email sending enable aidr.today`)
# then these From addresses can deliver. Override with EMAIL_FROM / EMAIL_NOTES_FROM.
EMAIL_FROM = "digest@aidr.today"
EMAIL_NOTES_FROM = "notes@aidr.today"
EMAIL_FROM_NAME = "aidr"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["digest@aidr.today", "notes@aidr.today"]

# Workers Cache: safe for this surface — only responses with public
# Cache-Control headers (feed/story APIs, static shell) are cached;
# /api/system is no-store so lastRun/runsToday recert is not edge-stale;
# admin/subscribe/suggest/submit/mcp set no-store and Authorization-bearing
# requests auto-bypass. Public GET /api/public is Cache-Control: public.
[cache]
enabled = true

[observability]
enabled = true

[[routes]]
pattern = "aidr.today"
custom_domain = true

# Do not attach news.duyet.net here — different Cloudflare account.
# monorepo / duyet.net owns the path-preserving redirect.
