<!doctype html>
<html lang="vi" data-theme="system" data-font="sans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hôm nay AI có gì mới?</title>
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="news-content">
        <header class="topbar">
          <!-- Desktop / wide header (matches HeaderBar wide row) -->
          <div class="topbar-inner topbar-wide">
            <a class="brand" href="https://aidr.today/" rel="noreferrer">
              <span class="brand-mark">AI;DR</span>
              <span class="brand-tagline" id="brand-tagline">Hôm nay AI có gì mới?</span>
            </a>
            <form class="search" id="search-form" action="https://aidr.today/" method="get">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="search"
                name="q"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm..."
                aria-label="Search AI news"
              />
            </form>
            <div class="actions">
              <a
                class="icon-btn"
                id="chrome-tab-link"
                href="https://aidr.today/extension"
                rel="noreferrer"
                title="Chrome new tab"
                aria-label="Chrome new tab"
              >
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a8 8 0 0 1 7.75 6H12.75L9.5 4.6A7.96 7.96 0 0 1 12 4Zm-3.4 1.2 3.5 6H4.25A8 8 0 0 1 8.6 5.2ZM4.1 14h7.15l-3.5 6.05A8 8 0 0 1 4.1 14Zm5.75 6.75L13.35 14H20a8 8 0 0 1-10.15 6.75Z" />
                </svg>
              </a>
              <a
                class="icon-btn"
                id="telegram-link"
                href="https://t.me/aihomnay"
                target="_blank"
                rel="noopener noreferrer"
                title="Telegram"
                aria-label="Telegram"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M22 2 11 13" />
                  <path d="M22 2 15 22l-4-9-9-4 20-7z" />
                </svg>
              </a>
              <a class="submit-btn" id="submit-btn" href="https://aidr.today/submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <span id="submit-label">Gửi bài</span>
              </a>
              <span class="actions-sep" aria-hidden="true"></span>
              <div class="prefs-host">
                <button type="button" class="aa-btn" id="open-settings" aria-label="Tuỳ chỉnh hiển thị" aria-haspopup="dialog" aria-expanded="false">
                  Aa
                </button>
              </div>
              <div class="lang-toggle" id="lang-toggle">
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
                <button type="button" data-lang="vi" aria-pressed="true">VI</button>
              </div>
              <a class="sign-in-btn" id="sign-in-btn" href="https://aidr.today/sign-in">Sign in</a>
            </div>
          </div>

          <!-- Phone / compact header (matches HeaderBar compact row) -->
          <div class="topbar-inner topbar-compact">
            <a class="brand brand-compact" href="https://aidr.today/" rel="noreferrer">
              <span class="brand-mark">AI;DR</span>
            </a>
            <form class="search search-compact" id="search-form-compact" action="https://aidr.today/" method="get">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="search-compact"
                name="q"
                type="search"
                autocomplete="off"
                placeholder="Tìm kiếm..."
                aria-label="Search AI news"
              />
            </form>
            <a
              class="icon-btn icon-btn-tap"
              href="https://aidr.today/extension"
              rel="noreferrer"
              aria-label="Chrome new tab"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a8 8 0 0 1 7.75 6H12.75L9.5 4.6A7.96 7.96 0 0 1 12 4Zm-3.4 1.2 3.5 6H4.25A8 8 0 0 1 8.6 5.2ZM4.1 14h7.15l-3.5 6.05A8 8 0 0 1 4.1 14Zm5.75 6.75L13.35 14H20a8 8 0 0 1-10.15 6.75Z" />
              </svg>
            </a>
            <a
              class="icon-btn icon-btn-tap"
              href="https://t.me/aihomnay"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Telegram"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M22 2 11 13" />
                <path d="M22 2 15 22l-4-9-9-4 20-7z" />
              </svg>
            </a>
            <div class="prefs-host">
              <button type="button" class="aa-btn icon-btn-tap" id="open-settings-compact" aria-label="Tuỳ chỉnh hiển thị" aria-haspopup="dialog" aria-expanded="false">
                Aa
              </button>
            </div>
            <button type="button" class="menu-btn icon-btn-tap" id="open-menu" aria-label="Open menu" aria-expanded="false" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </header>

        <main class="page">
          <p class="status" id="status" hidden></p>
          <p class="update-banner" id="update-banner" hidden>
            <span id="update-text"></span>
          </p>

          <nav class="cat-nav" id="section-categories" hidden></nav>

          <section class="trending" id="section-trending" hidden>
            <span class="trending-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 17 9 11l4 4 8-8" />
                <path d="M14 7h7v7" />
              </svg>
              <span id="trending-label">Xu hướng</span>
            </span>
            <div class="chips" id="trending"></div>
          </section>

          <section class="tldr" id="section-tldr" hidden data-aidr-layout="a">
            <div class="tldr-head">
              <div class="tldr-title">
                <h2>AI;DR</h2>
                <span class="muted" id="tldr-meta"></span>
              </div>
              <div class="tldr-counts" id="tldr-counts" hidden></div>
            </div>
            <div class="tldr-cols" id="tldr-cols"></div>
            <button type="button" class="tldr-more" id="tldr-more" hidden></button>
            <div class="tldr-foot">
              <span id="tldr-total"></span>
              <span id="tldr-updated"></span>
            </div>
          </section>

          <div id="section-stories" class="days" hidden></div>
        </main>
      </div>

      <footer class="site-footer">
        <div class="site-footer-inner">
          <div class="footer-top">
            <div class="footer-brand">
              <div class="footer-brand-mark">AI;DR</div>
              <p class="footer-brand-blurb">
                AI news ranked and translated hourly.
              </p>
            </div>
            <div class="footer-columns">
              <div class="footer-col">
                <p class="footer-col-label">Site</p>
                <nav aria-label="Footer site" class="footer-nav">
                  <a href="https://aidr.today/about" rel="noreferrer">About</a>
                  <a href="https://aidr.today/subscribe" rel="noreferrer">Subscribe</a>
                  <a href="https://aidr.today/privacy" rel="noreferrer">Privacy</a>
                  <a href="https://aidr.today/terms" rel="noreferrer">Terms</a>
                </nav>
              </div>
              <div class="footer-col">
                <p class="footer-col-label">Connect</p>
                <nav aria-label="Footer connect" class="footer-nav">
                  <a href="https://t.me/aihomnay" target="_blank" rel="noopener noreferrer">Telegram</a>
                  <a href="https://github.com/duyet/aidr" target="_blank" rel="noopener noreferrer">GitHub</a>
                </nav>
              </div>
            </div>
          </div>
          <div class="footer-meta">
            <span id="footer-copy"></span>
          </div>
        </div>
      </footer>
    </div>

    <!-- Phone menu (matches HeaderBar PhoneMenu) -->
    <div class="phone-menu" id="phone-menu" hidden>
      <button type="button" class="phone-menu-backdrop" id="close-menu-backdrop" aria-label="Close menu"></button>
      <div class="phone-menu-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="phone-menu-head">AI;DR</div>
        <nav class="phone-menu-nav" id="phone-menu-nav">
          <a href="https://aidr.today/">News</a>
          <a href="https://aidr.today/about">About</a>
          <a href="https://aidr.today/extension">Chrome tab</a>
          <a href="https://aidr.today/mcp">MCP</a>
          <a href="https://aidr.today/subscribe">Subscribe</a>
          <a href="https://t.me/aihomnay" target="_blank" rel="noopener noreferrer">Telegram</a>
          <a href="https://aidr.today/data">Data</a>
          <a href="https://aidr.today/submit">Submit</a>
          <a href="https://duyet.net" target="_blank" rel="noopener noreferrer">Home</a>
          <a href="https://blog.duyet.net" target="_blank" rel="noopener noreferrer">Blog</a>
        </nav>
        <div class="phone-menu-foot">
          <div class="phone-menu-lang">
            <span id="phone-lang-label">Ngôn ngữ</span>
            <div class="lang-toggle" id="lang-toggle-phone">
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
              <button type="button" data-lang="vi" aria-pressed="true">VI</button>
            </div>
          </div>
          <a class="sign-in-btn sign-in-stacked" href="https://aidr.today/sign-in">Sign in</a>
        </div>
      </div>
    </div>

    <script type="module" src="js/boot.js"></script>
    <script type="module" src="js/newtab.js"></script>
  </body>
</html>
