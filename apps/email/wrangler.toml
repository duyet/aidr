# aidr-email: Email Routing target for submit@aidr.today.
# Validates the sender and stores the message in D1 (`inbound_emails`). No
# LLM, no review, no outgoing mail: the hourly `inbound-email` step in the
# `aidr` Worker turns stored rows into submissions/suggestions and acks.
# Deploy: pnpm --filter @aidr/email deploy
# Routing rule (dashboard, not in config): Email Routing → Routing rules →
# submit@aidr.today → Send to a Worker → aidr-email.
# See docs/decisions/email-contributions.md.
name = "aidr-email"
account_id = "7df185a18b98382c3240fa7ac4a37075"
main = "src/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Same database as the `aidr` Worker (apps/web/wrangler.toml); migrations
# live in apps/web/migrations.
[[d1_databases]]
binding = "DB"
database_name = "aidr"
database_id = "0c8f3efe-0427-4268-8d9f-bb1a4bcbe427"

[observability]
enabled = true
