name: Digest preview binding

on:
  pull_request:

permissions:
  contents: read

jobs:
  send:
    name: Send via Worker email binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Delete one-off preview worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7df185a18b98382c3240fa7ac4a37075"
        run: pnpm exec wrangler delete --config wrangler.digest-preview-once.toml --force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-send
          path: apps/web/preview-send.log
          if-no-files-found: warn
