name: Digest preview once

on:
  pull_request:

permissions:
  contents: read

jobs:
  send:
    name: Send owner digest preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Send digest preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7df185a18b98382c3240fa7ac4a37075"
          OWNER_NOTIFY_EMAIL: ${{ secrets.OWNER_NOTIFY_EMAIL }}
        run: |
          set -euo pipefail
          curl -fsS "https://aidr.today/api/public" -o /tmp/public.json
          pnpm exec esbuild apps/web/worker/subscribe/send.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/digest-build.mjs
          node << 'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { buildDigestEmail } from "/tmp/digest-build.mjs";
          const snapshot = JSON.parse(readFileSync("/tmp/public.json", "utf8")).tldr;
          const owner = (process.env.OWNER_NOTIFY_EMAIL || "").trim() || "me@duyet.net";
          const { subject, html, text } = buildDigestEmail(snapshot.date, snapshot.bullets_en, "en", "preview", 5);
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN || "";
          const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/email/sending/send`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              to: owner,
              from: { address: "digest@aidr.today", name: "aidr" },
              subject, html, text,
            }),
          });
          const payload = await res.json();
          const log = {
            recipient: owner,
            ownerNotifyEmailConfigured: Boolean((process.env.OWNER_NOTIFY_EMAIL || "").trim()),
            subject,
            hero: html.includes('class="mail-hero"'),
            httpStatus: res.status,
            success: payload.success === true,
            result: payload.result ?? null,
            errors: payload.errors ?? null,
          };
          writeFileSync("preview-send.log", JSON.stringify(log, null, 2) + "\n");
          console.log(JSON.stringify({ recipient: owner, subject, httpStatus: res.status, success: log.success, errors: payload.errors ?? null }));
          if (!log.success) process.exit(1);
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-send
          path: preview-send.log
          if-no-files-found: warn
