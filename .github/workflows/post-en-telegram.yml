name: Send English digest once

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Post English digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -o /tmp/public.json "https://aidr.today/api/public?lang=en"
          python3 -c 'import os,sys; assert os.environ.get("TELEGRAM_BOT_TOKEN"); print("ready", open("/tmp/public.json").read().count("bullets_en"))'
