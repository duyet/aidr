name: Story Cards

# Renders pending story share cards off the Worker (Workers Free caps CPU at
# 10 ms) and uploads them to the `aidr-og` R2 bucket, served as static files
# at https://og.aidr.today. Uploads go through the Worker's admin route and
# its R2 binding, so the job needs only NEWS_ADMIN_TOKEN. See
# apps/web/scripts/render-og-cards.ts and ALGORITHM.md "Story share cards".
on:
  schedule:
    - cron: "10,40 * * * *"
  repository_dispatch:
    types: [og-cards]
  workflow_dispatch:

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pnpm sync-env` writes GitHub secrets to this environment.
    environment: production
    env:
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$NEWS_ADMIN_TOKEN" ]; then
            echo "::notice::Story cards skipped: set the NEWS_ADMIN_TOKEN secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Render and upload cards
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/render-og-cards.ts
