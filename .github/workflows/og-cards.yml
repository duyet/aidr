name: Story Cards

# Renders pending story share cards off the Worker (Workers Free caps CPU at
# 10 ms) and uploads them to the `aidr-og` R2 bucket, served as static files
# at https://og.aidr.today. See apps/web/scripts/render-og-cards.ts and
# ALGORITHM.md "Story share cards". Until the R2 secrets exist the script
# exits 0 with a notice and pages keep the Worker route.
on:
  schedule:
    - cron: "10,40 * * * *"
  repository_dispatch:
    types: [og-cards]
  workflow_dispatch:

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pnpm sync-env` writes GitHub secrets to this environment.
    environment: production
    env:
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$NEWS_ADMIN_TOKEN" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Story cards skipped: set NEWS_ADMIN_TOKEN, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repo secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Render and upload cards
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/render-og-cards.ts
