name: ios

on:
  push:
    branches: [master, "feat/ios-*"]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-26 is the arm64 image. Its Xcode 26.6 carries the iOS 26.5 SDK and
    # simulators (actions/runner-images, images/macos/macos-26-arm64-Readme.md).
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project AIDR.xcodeproj -scheme AIDR \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AIDRKitTests \
            -resultBundlePath build/unit.xcresult -quiet 2>&1 | tee build/unit.log

      - name: UI tests (screenshot journey)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test -project AIDR.xcodeproj -scheme AIDR \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AIDRUITests \
            -resultBundlePath build/ui.xcresult -quiet 2>&1 | tee build/ui.log

      - name: Export screenshots
        if: always()
        run: |
          test -d build/ui.xcresult || exit 0
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/attachments
          python3 scripts/export-screenshots.py build/attachments build/screenshots

      - name: Test summary
        if: always()
        run: |
          mkdir -p build/summary
          for r in unit ui; do
            test -d "build/$r.xcresult" || continue
            xcrun xcresulttool get test-results summary --path "build/$r.xcresult" --compact > "build/summary/$r.json"
            python3 scripts/test-summary.py "build/summary/$r.json" "$r" | tee -a build/summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          done
          cp build/*.log build/summary/ 2>/dev/null || true

      - name: Archive unsigned IPA
        id: archive
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild archive -project AIDR.xcodeproj -scheme AIDR \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/AIDR.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet 2>&1 | tee build/archive.log
          mkdir -p build/ipa/Payload
          cp -R build/AIDR.xcarchive/Products/Applications/AIDR.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../AIDR-unsigned.ipa Payload)
          unzip -l build/AIDR-unsigned.ipa | grep -E "Payload/AIDR.app/(AIDR|Info.plist)$"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: apps/ios/build/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        with:
          name: AIDR-unsigned-ipa
          path: apps/ios/build/AIDR-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: apps/ios/build/summary
          if-no-files-found: warn

  # Signs the Release build with the App Store Connect API key and uploads it.
  # Runs on master and on manual dispatch only, and skips itself until the
  # four secrets exist (apps/ios/README.md, "TestFlight").
  testflight:
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight skipped: set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID" >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: .

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - name: Prepare
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ExportOptions-AppStore.plist > build/ExportOptions.plist

      - name: Archive signed build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive -project AIDR.xcodeproj -scheme AIDR \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/AIDR.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" -quiet 2>&1 | tee build/archive.log

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/AIDR.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/upload.log
          echo "Uploaded build ${{ github.run_number }} to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
        working-directory: .

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.secrets.outputs.ready == 'true' }}
        with:
          name: testflight-logs
          path: apps/ios/build/*.log
          if-no-files-found: ignore
