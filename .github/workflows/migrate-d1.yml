name: Migrate D1

# Apply pending D1 migrations. deploy-web.yml calls this as its first job, so a
# push that adds a migration applies it before the Worker deploys. Run it by
# hand with workflow_dispatch. There is no push trigger: one would race the
# deploy-web gate ("required migration is not applied").
on:
  workflow_call:
    inputs:
      verify-live:
        description: Probe the live site after applying
        type: boolean
        default: true
  workflow_dispatch:

# Never cancelled: a half-applied migration is worse than a queued one.
# Shared by every caller, so concurrent runs apply one at a time.
concurrency:
  group: migrate-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://aidr.today
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Validate required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi
          echo "Required secrets present"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations (aidr, remote)
        run: pnpm --filter @aidr/web d1:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7df185a18b98382c3240fa7ac4a37075"

      - name: Verify live sources total
        if: ${{ inputs.verify-live != false }}
        run: |
          count=$(curl -s --max-time 30 'https://aidr.today/api/system' -H 'Cache-Control: no-store' | python3 -c "import json,sys; print(json.load(sys.stdin)['totals']['sources'])")
          echo "Live sources total: $count"
