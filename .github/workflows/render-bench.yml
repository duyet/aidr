name: Render bench

# Temporary: measures the daily render on ubuntu-latest for the perf/daily-render-parallel branch.
# Builds the committed 2026-10-10 edition offline (--no-voice, no secrets) and renders with the
# settings under test. Nothing is posted. Delete before merge.
on:
  push:
    branches: [perf/daily-render-parallel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: w1-16x9, fmt: 16x9, res: landscape-4k, workers: "1" }
          - { name: w2-16x9, fmt: 16x9, res: landscape-4k, workers: "2" }
          - { name: w3-16x9, fmt: 16x9, res: landscape-4k, workers: "3" }
          - { name: w4-16x9, fmt: 16x9, res: landscape-4k, workers: "4" }
          - { name: w1-9x16, fmt: 9x16, res: portrait-4k, workers: "1" }
          - { name: w2-9x16, fmt: 9x16, res: portrait-4k, workers: "2" }
          - { name: w3-9x16, fmt: 9x16, res: portrait-4k, workers: "3" }
          - { name: w4-9x16, fmt: 9x16, res: portrait-4k, workers: "4" }
          - { name: dual-w1, dual: "true", workers: "1" }
          - { name: dual-w2, dual: "true", workers: "2" }
    env:
      CI: "true"
      AIDR_NO_HEYGEN: "1"
      DATE: "2026-10-10"
    defaults:
      run:
        working-directory: videos/daily-news
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
      - name: Renderer browser
        run: npx --yes hyperframes@0.8.96 browser ensure
      - name: Host
        run: nproc; free -m; uptime
      - name: Build (no voice)
        run: node scripts/daily.mjs "$DATE" --no-voice
      - name: Render ${{ matrix.name }}
        env:
          FMT: ${{ matrix.fmt }}
          RES: ${{ matrix.res }}
          WORKERS: ${{ matrix.workers }}
          DUAL: ${{ matrix.dual }}
        run: |
          mkdir -p "editions/$DATE/renders"
          render() {
            ( cd "editions/$DATE/out/$1" && npx --yes hyperframes@0.8.96 render --resolution "$2" --quality high --fps 30 --workers "$WORKERS" --output "../../renders/bench-$1.mp4" )
          }
          start=$(date +%s)
          if [ "$DUAL" = "true" ]; then
            render 16x9 landscape-4k > render-16x9.log 2>&1 &
            p1=$!
            render 9x16 portrait-4k > render-9x16.log 2>&1 &
            p2=$!
            wait $p1; wait $p2
            cat render-16x9.log render-9x16.log
          else
            render "$FMT" "$RES"
          fi
          echo "BENCH ${{ matrix.name }} wall=$(( $(date +%s) - start ))s"
          ls -la "editions/$DATE/renders"
          for f in "editions/$DATE/renders"/bench-*.mp4; do ffprobe -v error -show_entries format=duration:stream=nb_frames,width,height -of flat "$f"; done
