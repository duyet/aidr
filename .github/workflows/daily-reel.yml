name: Daily Reel
# The day video watchdog (apps/web/worker/day-video-watchdog.ts) reads the
# date input and the dry-run marker from the title.
run-name: Daily Reel${{ inputs.date && format(' {0}', inputs.date) || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Renders the day's English AI;DR Daily Brief and posts it without an agent:
# script (auto-script.mjs: model, else template) → render (9:16 + 16:9) → gate
# → YouTube (Data API, only when its OAuth secrets exist) → day page → Facebook
# Reel → Telegram, then the same English video with Vietnamese subtitles (cut
# `visub`: YouTube with Vietnamese metadata, the Vietnamese day page, the
# Vietnamese Telegram channel; it never blocks or undoes the English posts).
# Every public step is idempotent (videos/daily-news/README.md "Automated run").
# The cron runs after the 08:00 Asia/Ho_Chi_Minh digest.
# Manual runs default to dry_run: render + gate + print the posting plan.
on:
  schedule:
    - cron: "30 2 * * *" # 09:30 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and gate only; post nothing"
        type: boolean
        default: true
      date:
        description: "Edition date YYYY-MM-DD (default: today in Asia/Ho_Chi_Minh; past dates need a committed edition.json)"
        type: string
        default: ""

concurrency:
  group: daily-reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CI: "true"
      AIDR_NO_HEYGEN: "1"
      # schedule → live; dispatch → live only when dry_run is unticked.
      LIVE: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
      ANYROUTER_API_KEY: ${{ secrets.ANYROUTER_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}
      TELEGRAM_VI_CHAT_ID: ${{ secrets.TELEGRAM_VI_CHAT_ID }}
    defaults:
      run:
        working-directory: videos/daily-news
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
          ffmpeg -version | head -1

      - name: Resolve date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-$(TZ=Asia/Ho_Chi_Minh date +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date $d" >&2; exit 1; }
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "date $d · live $LIVE"

      # STATUS.json is gitignored; the cache carries it between runs of the same
      # day so a rerun never posts Telegram twice (YouTube and Facebook are also
      # checked against the live day page / the Page itself). It also keeps the
      # visub translations, so a rerun burns the same Vietnamese captions and
      # screen text and sends the same Vietnamese YouTube description.
      - name: Restore STATUS.json
        uses: actions/cache/restore@v6
        with:
          path: |
            videos/daily-news/editions/${{ steps.date.outputs.date }}/STATUS.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/HAND_PUBLISHED
            videos/daily-news/editions/${{ steps.date.outputs.date }}/captions.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/youtube.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/screen.visub.json
          key: daily-reel-status-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-reel-status-${{ steps.date.outputs.date }}-

      # A day an agent already published by hand (on the day page, and no STATUS
      # from this workflow) still gets its Reel, but never a second Telegram post.
      - name: Already published by hand?
        id: check
        run: |
          status="editions/${{ steps.date.outputs.date }}/STATUS.json"
          set +e
          node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps check
          code=$?
          set -e
          if [ -f "editions/${{ steps.date.outputs.date }}/HAND_PUBLISHED" ] || { [ "$code" = 3 ] && [ ! -f "$status" ]; }; then
            mkdir -p "editions/${{ steps.date.outputs.date }}" && touch "editions/${{ steps.date.outputs.date }}/HAND_PUBLISHED"
            echo "hand=true" >> "$GITHUB_OUTPUT"
            echo "Published by hand: Reel only, no Telegram"
          elif [ "$code" != 0 ] && [ "$code" != 3 ]; then
            exit "$code"
          fi

      - name: Renderer browser
        run: npx --yes hyperframes@0.8.96 browser ensure

      - name: Write script.json
        run: node scripts/auto-script.mjs --date "${{ steps.date.outputs.date }}"

      - name: Render
        id: render
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps render --render-published

      - name: Gate
        id: gate
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps gate

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-reel-${{ steps.date.outputs.date }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            videos/daily-news/editions/${{ steps.date.outputs.date }}/renders/*-reel.mp4
            videos/daily-news/editions/${{ steps.date.outputs.date }}/renders/*.png
            videos/daily-news/editions/${{ steps.date.outputs.date }}/script.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/script.source.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/edition.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/posts.md
            videos/daily-news/editions/${{ steps.date.outputs.date }}/captions.srt
            videos/daily-news/editions/${{ steps.date.outputs.date }}/STATUS.json

      - name: Posting plan (dry run)
        if: env.LIVE != 'true'
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps upload,attach,facebook,telegram --uploader api --dry-run

      - name: YouTube upload + day page
        id: youtube
        if: ${{ !cancelled() && env.LIVE == 'true' && steps.gate.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] || [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "YouTube: no YOUTUBE_CLIENT_ID/SECRET/REFRESH_TOKEN secrets; skipping upload and attach"
            exit 0
          fi
          node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps upload,attach --uploader api

      - name: Facebook Reel
        id: facebook
        if: ${{ !cancelled() && env.LIVE == 'true' && steps.gate.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps facebook --prod

      - name: Telegram
        if: ${{ !cancelled() && env.LIVE == 'true' && steps.check.outputs.hand != 'true' && steps.gate.outcome == 'success' }}
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang en --steps telegram --prod

      # Vietnamese subtitles over the English cut: reuses this runner's English
      # voice, mix and timing, translates the captions (ANYROUTER_API_KEY), and
      # renders one 1080p 16:9. Then YouTube (Vietnamese title and description,
      # English audio) and the Vietnamese day page, unless the Vietnamese-voice
      # cut is that page's video, and the Vietnamese channel; no Facebook. Runs
      # after the English posts and needs only the English render, so a failed
      # English post does not stop it (`!cancelled()`); a failure here fails the
      # job at the end and nothing else. A failed upload still lets the Telegram
      # post go out, its button linking the English video when there is one.
      # That post is the last one and does not continue on error: the jobs API
      # reports a failed continue-on-error step as `success`, and the day video
      # watchdog reads this step's result from that API.
      - name: Vietnamese subtitles cut
        id: visub
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang visub --steps render,gate --render-published

      - name: Vietnamese subtitles posting plan (dry run)
        if: ${{ !cancelled() && env.LIVE != 'true' && steps.visub.outcome == 'success' }}
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang visub --steps upload,attach,telegram --uploader api --prod --dry-run

      - name: YouTube upload + day page (Vietnamese subtitles)
        id: visub_youtube
        if: ${{ !cancelled() && env.LIVE == 'true' && steps.visub.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] || [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "YouTube: no YOUTUBE_CLIENT_ID/SECRET/REFRESH_TOKEN secrets; skipping the Vietnamese subtitles upload and attach"
            exit 0
          fi
          node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang visub --steps upload,attach --uploader api

      - name: Telegram (Vietnamese subtitles)
        id: visub_telegram
        if: ${{ !cancelled() && env.LIVE == 'true' && steps.check.outputs.hand != 'true' && steps.visub.outcome == 'success' }}
        run: node scripts/publish.mjs "${{ steps.date.outputs.date }}" --lang visub --steps telegram --prod

      - name: Upload Vietnamese subtitles artifact
        if: always() && steps.visub.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: daily-reel-${{ steps.date.outputs.date }}-visub
          retention-days: 14
          if-no-files-found: warn
          path: |
            videos/daily-news/editions/${{ steps.date.outputs.date }}/captions.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/youtube.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/screen.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/captions.visub.srt
            videos/daily-news/editions/${{ steps.date.outputs.date }}/timeline.json

      - name: Save STATUS.json
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            videos/daily-news/editions/${{ steps.date.outputs.date }}/STATUS.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/HAND_PUBLISHED
            videos/daily-news/editions/${{ steps.date.outputs.date }}/captions.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/youtube.visub.json
            videos/daily-news/editions/${{ steps.date.outputs.date }}/screen.visub.json
          key: daily-reel-status-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the Vietnamese subtitles cut did not post
        if: ${{ always() && (steps.visub.outcome == 'failure' || steps.visub_youtube.outcome == 'failure' || steps.visub_telegram.outcome == 'failure') }}
        run: |
          echo "The Vietnamese subtitles cut failed (see the visub steps' log and STATUS.json uploadError)." >&2
          exit 1

      - name: Fail when the YouTube upload did not post
        if: ${{ always() && steps.youtube.outcome == 'failure' }}
        run: |
          echo "The YouTube upload step failed (see its log)." >&2
          exit 1

      - name: Fail when the Reel did not post
        if: ${{ always() && steps.facebook.outcome == 'failure' }}
        run: |
          echo "The Facebook Reel step failed (see its log)." >&2
          exit 1
