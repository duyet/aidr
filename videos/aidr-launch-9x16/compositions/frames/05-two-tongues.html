  <script>
    (() => {
      const ID = "05-two-tongues";
      const P = ".f05-two-tongues-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (sel) => root.querySelector(sel);
      const words = (sel) => Array.from(root.querySelectorAll(sel + " " + P + "w"));

      // Parking ease: each frame covers ~15% of the remaining distance.
      const park = (k = 0.15, fps = 30) => (dur) => (p) =>
        (1 - Math.pow(1 - k, p * dur * fps)) / (1 - Math.pow(1 - k, dur * fps));

      // The whole shot is authored at 120 BPM and played 10/9 faster (a 1.8s bar = 54 frames at 30fps).
      // `seq` holds the authored sequence; the registered, paused `tl` plays it at that speed.
      const seq = gsap.timeline();

      // The one root push: 3% over the whole frame, linear.
      seq.fromTo(q(P + "cam"), { scale: 1 }, { scale: 1.03, duration: 4, ease: "none" }, 0);

      // Scene 1 — toggle labels settle from the outer edges (top and bottom).
      seq.fromTo(q(P + "lang-en"), { y: -28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: park()(0.4) }, 0.1);
      seq.fromTo(q(P + "lang-vi"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: park()(0.4) }, 0.2);

      // Scene 1 — first pair arrives in mirror on the beat, 3-frame stagger.
      const ARRIVE = 0.5;
      seq.fromTo(q(P + "a-en"), { y: -180, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: park()(0.5) }, ARRIVE);
      seq.fromTo(q(P + "a-vi"), { y: 180, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: park()(0.5) }, ARRIVE + 0.1);

      // Scene 2 — waterfall cut at 2.0s, mirrored vertically: each half travels outward from the hinge (EN up, VI down).
      const CUT = 2.0;
      const TRAVEL = 230;
      const EXIT_SPAN = 0.2; // first word leaves this long before the last
      const ENTRY_SPAN = 0.24; // cascade length, first ignition to last

      const sides = [
        { a: P + "a-en", b: P + "b-en", dir: -1 },
        { a: P + "a-vi", b: P + "b-vi", dir: 1 },
      ];

      sides.forEach(({ a, b, dir }) => {
        const out = words(a);
        const step = EXIT_SPAN / (out.length - 1);
        out.forEach((w, i) => {
          // Last word finishes fading exactly at the cut.
          const at = CUT - 0.18 - (out.length - 1 - i) * step;
          seq.to(w, { y: dir * TRAVEL, duration: 0.34, ease: "power4.in" }, at);
          seq.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, at);
        });

        const inn = words(b);
        gsap.set(inn, { y: -dir * TRAVEL, opacity: 0 });
        // Shrinking gaps (×0.84 per word) so the cascade accelerates, normalised to one span per side.
        const gaps = inn.slice(1).map((_, i) => Math.pow(0.84, i));
        const total = gaps.reduce((s, g) => s + g, 0);
        let at = CUT;
        inn.forEach((w, i) => {
          if (i > 0) at += (gaps[i - 1] / total) * ENTRY_SPAN;
          seq.fromTo(
            w,
            { y: -dir * TRAVEL, opacity: 0.35 },
            { y: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
            at
          );
        });
      });

      // Scene 3 — hold. Only the push is running.

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.add(seq.timeScale(10 / 9), 0);
      window.__timelines[ID] = tl;
    })();
  </script>
