      seq.fromTo(".f04-digest-credit-name", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: park()(0.45) }, 3.79 - LEAD + 3 * FRAME);

      window.__timelines = window.__timelines || {};
