  <script>
    (function () {
      const ID = "03-marker-pass";
      const FPS = 30;
      const DURATION = 4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const one = (name) => root.querySelector('[class~="' + ID + "-" + name + '"]');
      const all = (name) => Array.from(root.querySelectorAll('[class~="' + ID + "-" + name + '"]'));

      // Parking ease: each frame covers k of the remaining distance.
      const park = (k = 0.15, fps = FPS) => (dur) => (p) =>
        (1 - Math.pow(1 - k, p * dur * fps)) / (1 - Math.pow(1 - k, dur * fps));

      // ---- Geometry -------------------------------------------------------------
      // Advance widths of EB Garamond Variable 500 in em (measured in Chrome from the
      // shipped woff2), so both the paragraph seat and the headline rest position of
      // every chunk are known without reading layout at build time.
      const EM = {
        // headline prefixes
        anthropic_: 4.373984375, // "Anthropic "
        compute_: 7.807421875, // "$518B of Compute "
        space: 0.2130625,
        deals: 2.16284375, // "Deals"
        // paragraph line 9: "4,000+ Apps. UPDATE: Anthropic"
        p9Anthropic: 9.942828125,
        // paragraph line 10: "Locked Into $518B of Compute Deals,"
        p10Dollar: 5.04125,
        p10Deals: 12.848671875,
      };
      const HL = 76; // headline px
      const PF = 56; // paragraph px
      const S = PF / HL; // a chunk at paragraph size
      const PARA_TOP = 230;
      const LEADING = 73;
      const PARA_BASE = 56; // baseline inside a 73px paragraph line box
      const HL_TOP = 631.26; // headline box top, the same value frame 04 opens on
      const HL_BASE = 68; // baseline inside a 76px/1.1 headline line box, as Chrome sets it
      const HL_X = 150;
      const HL_Y1 = HL_TOP + HL_BASE;
      const HL_Y2 = HL_Y1 + HL * 1.1;
      const HL_Y3 = HL_Y2 + HL * 1.1;
      const COL_X = 80;
      const CX = 540; // canvas centre
      const CY = 960;
      const PUSH = 1.03; // the stage is counter-scaled by 1/PUSH about the canvas centre

      // The paragraph is ragged right, so every seat sits at its natural advance.
      const yLine9 = PARA_TOP + 8 * LEADING + PARA_BASE;
      const yLine10 = PARA_TOP + 9 * LEADING + PARA_BASE;
      const yLine11 = PARA_TOP + 10 * LEADING + PARA_BASE;

      // seat = [x in column, baseline y] in the paragraph; rest = the same in the headline.
      const UNITS = {
        a: { seat: [EM.p9Anthropic * PF, yLine9], rest: [0, HL_Y1] },
        li: { seat: [0, yLine10], rest: [EM.anthropic_ * HL, HL_Y1] },
        b1: { seat: [EM.p10Dollar * PF, yLine10], rest: [0, HL_Y2] },
        b2: { seat: [EM.p10Deals * PF, yLine10], rest: [EM.compute_ * HL, HL_Y2] },
        c: { seat: [0, yLine11], rest: [0, HL_Y3] },
      };
      // Seats are paragraph (camera) coordinates; chunks live in the counter-scaled
      // stage, so a seat is mapped into stage space before it is compared with the rest.
      const seatState = (u) => ({
        x: CX + (COL_X + u.seat[0] - CX) * PUSH - (HL_X + u.rest[0]),
        y: CY + (u.seat[1] - CY) * PUSH - u.rest[1],
        scale: S * PUSH,
        transformOrigin: "0px " + HL_BASE + "px",
      });

      // "Deals" shares its chunk with the comma, so its marker is sized to the word.
      // It now follows "$518B of Compute" on the same line, so it starts where that
      // bar ends and the two read as one stroke.
      const BLEED = 7;
      const SKEW = -6;
      const JOIN = EM.space * HL - BLEED + 1;
      [one("bar-b2"), one("tipwrap-b2")].forEach((el) => {
        el.style.left = -JOIN + "px";
        el.style.right = "auto";
        el.style.width = JOIN + EM.deals * HL + BLEED + "px";
      });

      // The whole shot is authored at 120 BPM and played 10/9 faster (a 1.8s bar = 54 frames at 30fps).
      // `seq` holds the authored sequence; the registered, paused `tl` plays it at that speed.
      const seq = gsap.timeline();

      // ---- The film's one linear push (3%) --------------------------------------
      seq.fromTo(one("camera"), { scale: 1 }, { scale: 1.03, duration: DURATION, ease: "none" }, 0);

      // ---- Scene 2 (1.0–2.5s): the marker, one phrase per beat --------------------
      const sweep = (key, at, dur) => {
        seq.fromTo(
          one("bar-" + key),
          { scaleX: 0, skewX: SKEW, transformOrigin: "0% 50%" },
          { scaleX: 1, skewX: SKEW, duration: dur, ease: "power2.out" },
          at,
        );
        // The nib tracks the bar's front edge, then resolves to a clean end.
        const tip = one("tipwrap-" + key);
        seq.fromTo(tip, { xPercent: 0 }, { xPercent: 100, duration: dur, ease: "power2.out" }, at);
        seq.set(tip, { opacity: 1 }, at);
        seq.fromTo(
          tip,
          { opacity: 1 },
          { opacity: 0, duration: dur * 0.55, ease: "power1.in", immediateRender: false },
          at + dur * 0.45,
        );
        // Marked words come up to full ink as the marker passes.
        seq.fromTo(
          one("ink-" + key),
          { opacity: 0.8 },
          { opacity: 1, duration: dur, ease: "power2.out", immediateRender: false },
          at,
        );
      };
      sweep("a", 1.0, 0.3); // "Anthropic"
      sweep("b1", 1.5, 0.3); // "$518B of Compute" …
      sweep("b2", 1.8, 0.2); // … "Deals": the same stroke, carried on along the line
      sweep("c", 2.0, 0.38); // "80% Non-Cancelable"

      // ---- Scene 3 (2.5–4.0s): the rest falls away, the marked words lock up ------
      const LIFT = 2.5;
      const para = one("para");
      seq.fromTo(
        para,
        { opacity: 0.8 },
        { opacity: 0.12, duration: 0.35, ease: "power2.out", immediateRender: false },
        LIFT,
      );
      seq.fromTo(
        para,
        { opacity: 0.12 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
        LIFT + 0.35,
      );
      // The leftovers of the two lines the headline is lifted from clear first, so
      // nothing ghosts under the words as they grow.
      seq.fromTo(
        all("under"),
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
        LIFT,
      );

      // Chunks leave two frames apart and are all parked by 3.15s. Every chunk rises
      // out of lines 9–11 into the headline block as it grows; "Anthropic" and
      // "$518B of Compute" also cross the column leftwards, so they carry the blur.
      const TRAVEL = [
        { key: "a", at: LIFT, dur: 0.6, marked: true, blur: true },
        { key: "li", at: LIFT + 2 / FPS, dur: 0.55 },
        { key: "b1", at: LIFT + 2 / FPS, dur: 0.55, marked: true, blur: true },
        { key: "c", at: LIFT + 4 / FPS, dur: 0.5, marked: true },
        { key: "b2", at: LIFT + 6 / FPS, dur: 0.45, marked: true },
      ];
      TRAVEL.forEach(({ key, at, dur, marked, blur }) => {
        seq.fromTo(
          one("chunk-" + key),
          seatState(UNITS[key]),
          { x: 0, y: 0, scale: 1, duration: dur, ease: park()(dur) },
          at,
        );
        if (marked) {
          // Marker colour drains to plain ink as the chunk lands.
          seq.fromTo(
            one("bar-" + key),
            { opacity: 1 },
            { opacity: 0, duration: dur - 0.1, ease: "power2.inOut", immediateRender: false },
            at + 0.1,
          );
        }
        if (blur) {
          // Blur along the path: strongest on the first frames, gone before the landing.
          const ghost = one("ghost-" + key);
          const ink = one("ink-" + key);
          seq.fromTo(ghost, { opacity: 0 }, { opacity: 0.8, duration: 2 / FPS, ease: "power1.out" }, at);
          seq.fromTo(
            ghost,
            { opacity: 0.8 },
            { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
            at + 2 / FPS,
          );
          seq.fromTo(
            ink,
            { opacity: 1 },
            { opacity: 0.6, duration: 2 / FPS, ease: "power1.out", immediateRender: false },
            at,
          );
          seq.fromTo(
            ink,
            { opacity: 0.6 },
            { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false },
            at + 2 / FPS,
          );
        }
      });

      // Connectives ("Locked Into", the comma) sink with the paragraph, ride along
      // unmarked, and come back to ink as the headline locks.
      const links = [one("ink-li"), one("comma")];
      seq.fromTo(
        links,
        { opacity: 0.8 },
        { opacity: 0.12, duration: 0.35, ease: "power2.out", immediateRender: false },
        LIFT,
      );
      seq.fromTo(
        links,
        { opacity: 0.12 },
        { opacity: 1, duration: 0.3, ease: park()(0.3), immediateRender: false },
        2.9,
      );

      // Label, then numeral three frames later; everything is still from 3.4s.
      seq.fromTo(
        one("label"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: park()(0.3) },
        3.0,
      );
      seq.fromTo(
        one("numeral"),
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.3, ease: park()(0.3) },
        3.0 + 3 / FPS,
      );

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.add(seq.timeScale(10 / 9), 0);
      window.__timelines[ID] = tl;
    })();
  </script>
