  <script>
    (function () {
      const FRAME_ID = "07-lockup";
      const root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      const $ = (name) => root.querySelector('[id="' + FRAME_ID + "-" + name + '"]');

      // Parking ease: each frame covers ~15% of the remaining distance.
      const park = (k = 0.15, fps = 30) => (dur) => (p) =>
        (1 - Math.pow(1 - k, p * dur * fps)) / (1 - Math.pow(1 - k, dur * fps));

      const BEAT = 0.5;
      const FRAME = 1 / 30;

      // The whole shot is authored at 120 BPM and played 10/9 faster (a 1.8s bar = 54 frames at 30fps).
      // `seq` holds the authored sequence; the registered, paused `tl` plays it at that speed.
      const seq = gsap.timeline();

      // The one root push: linear, whole duration, 3%.
      seq.fromTo(
        $("camera"),
        { scale: 1 },
        { scale: 1.03, duration: 6, ease: "none", force3D: false },
        0,
      );

      // Scene 1 (0.0–0.8s): the semicolon alone, exactly as frame 1 opened. No tween.

      // Scene 2 (0.8–1.4s): wordmark travels to the lockup while the letters slide out.
      // Opening: 7.53px/unit, semicolon centre on (960, 470).
      // Lockup: 2.8px/unit (cap height 193px), wordmark centred on x 960, cap top at y 290.
      const OUT = 0.8;
      const LOCK = 1.4;
      seq.fromTo(
        $("mark"),
        { x: 0, y: 0, scale: 1 },
        {
          x: 446.8,
          y: 311.295,
          scale: 2.8 / 7.53,
          duration: LOCK - OUT,
          ease: park()(LOCK - OUT),
          force3D: false,
        },
        OUT,
      );

      // Each side leaves as a drawer from behind the semicolon: the outer letter
      // leads, the inner one follows 3 frames later over the same distance, so
      // the pair never overlaps and every glyph is born at the clip edge.
      const LETTERS = [
        { id: "a", from: 99.5, delay: 0, blur: 3.2 },
        { id: "r", from: -145, delay: 0, blur: 4.6 },
        { id: "i", from: 99.5, delay: 3 * FRAME, blur: 3.2 },
        { id: "d", from: -145, delay: 3 * FRAME, blur: 4.6 },
      ];
      LETTERS.forEach((letter) => {
        const el = $(letter.id);
        const fe = $("blur-" + letter.id + "-fe");
        const start = OUT + letter.delay;
        const dur = LOCK - start;
        const ease = park()(dur);

        seq.fromTo(el, { x: letter.from }, { x: 0, duration: dur, ease: ease }, start);
        // A letter does not exist until it starts to leave: hidden before `start`, so nothing
        // can show around the semicolon while it waits. No blur filter on the letters either:
        // a blurred glyph bleeds past its clip edge and reads as a dirty shadow on the yellow.
        seq.fromTo(el, { opacity: 0 }, { opacity: 1, duration: FRAME, ease: "none" }, start);

        // Blur follows speed: widest on the first frame, zero on landing.
        const smear = { v: letter.blur };
        seq.fromTo(
          smear,
          { v: letter.blur },
          {
            v: 0,
            duration: dur,
            ease: ease,
            onUpdate: () => fe.setAttribute("stdDeviation", smear.v.toFixed(3) + " 0"),
          },
          start,
        );
        // At rest the filter is gone entirely, so the locked glyphs are pure vector.
        seq.set(el, { attr: { filter: "none" } }, LOCK);
      });

      // Scene 3 (1.6–3.0s): the line arrives in three phrases on half-beats,
      // complete by 2.5s; the address follows on the next half-beat.
      const words = Array.from($("line").querySelectorAll("span"));
      const PHRASES = [
        { at: 3.5 * BEAT, words: [0, 1] }, // What's happening
        { at: 4.0 * BEAT, words: [2, 3] }, // in AI
        { at: 4.5 * BEAT, words: [4] }, // today?
      ];
      const WORD_DUR = 0.3;
      PHRASES.forEach((phrase) => {
        phrase.words.forEach((index, n) => {
          seq.fromTo(
            words[index],
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: WORD_DUR, ease: park()(WORD_DUR), force3D: false },
            phrase.at + n * 3 * FRAME,
          );
        });
      });

      // Lands by 3.0s so the last full second is still.
      const URL_DUR = 0.25;
      seq.fromTo(
        $("url"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: URL_DUR, ease: park()(URL_DUR), force3D: false },
        5.5 * BEAT,
      );

      // Scene 4 (3.0–4.0s): the hold. Only the root push is still running.

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.add(seq.timeScale(10 / 9), 0);
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
