  <script>
    (function () {
      const ID = "02-318-to-8";
      const FPS = 30;
      const DURATION = 4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const all = (name) => Array.from(root.querySelectorAll('[class~="' + ID + "-" + name + '"]'));

      // Parking ease: each frame covers k of the remaining distance.
      const park = (k = 0.15, fps = FPS) => (dur) => (p) =>
        (1 - Math.pow(1 - k, p * dur * fps)) / (1 - Math.pow(1 - k, dur * fps));

      // The eight real headlines of edition 2026-09-30, word for word.
      const HEADLINES = [
        "UPDATE: Anthropic Locked Into $518B of Compute Deals, 80% Non-Cancelable",
        "UPDATE: Trump Releases AI Accord Requiring External Audits and Board Oversight",
        "UPDATE: OpenAI Scraps Planned October Launch of GPT-6.1 Astra in Rare Safety Rollback",
        "OpenAI Seeks $30B Bridge Round at $1.4 Trillion Valuation",
        "UPDATE: OpenAI Launches Dots, Always-On Agents That Work Across 4,000+ Apps",
        "Trump and Tech CEOs Align on Voluntary AI Regulation",
        "UPDATE: US Cloud Giants Boost AI Capex Outlook 66% to $1.89 Trillion",
        "OpenAI apologizes to Australia after its AI agents breached government sites",
      ];
      // Headline indices per row (top to bottom); each headline appears three times across the wall.
      const ROW_HEADLINES = [
        [0, 1, 2, 3],
        [4, 5, 6, 7],
        [5, 6, 7, 0],
        [1, 2, 3, 4],
        [3, 4, 5, 6],
        [7, 0, 1, 2],
      ];

      const rows = all("row");
      const strips = all("strip");
      strips.forEach((strip, i) => {
        ROW_HEADLINES[i].forEach((h) => {
          const text = document.createElement("span");
          text.textContent = HEADLINES[h];
          const sep = document.createElement("span");
          sep.className = ID + "-sep";
          strip.append(text, sep);
        });
      });

      const tl = gsap.timeline({ paused: true });

      // The film's single linear push, whole duration.
      tl.fromTo(all("camera"), { scale: 1 }, { scale: 1.03, duration: DURATION, ease: "none" }, 0);

      // Handoff in: arriving through the dot, scale settles from large to 1, no x/y drift.
      const ZOOM_DUR = 0.6;
      tl.fromTo(all("zoom"), { scale: 1.6 }, { scale: 1, duration: ZOOM_DUR, ease: park()(ZOOM_DUR) }, 0);

      // Headline wall. Rows enter and leave outside-in, so the rows behind the numeral go last.
      const ROW_ORDER = [0, 5, 1, 4, 2, 3];
      const ENTER_AT = 0.05;
      const ENTER_STAGGER = 0.1; // 3 frames
      const ENTER_DUR = 0.4;
      const ENTER_DIST = 600;
      const ENTER_BLUR = 34;
      const EXIT_AT = 0.95; // each row is gone on a half-beat: 1.25s … 2.5s
      const EXIT_STEP = 0.25;
      const EXIT_DUR = 0.3;
      const EXIT_DIST = 2600;
      const EXIT_BLUR = 64;
      const DRIFT = [120, 70]; // px/s: front layer, back layer

      ROW_ORDER.forEach((rowIndex, order) => {
        const row = rows[rowIndex];
        const strip = strips[rowIndex];
        const dir = rowIndex % 2 === 0 ? 1 : -1;
        const blurNode = document.getElementById(ID + "-blur-" + rowIndex).firstElementChild;
        const enterAt = ENTER_AT + order * ENTER_STAGGER;
        const exitAt = EXIT_AT + order * EXIT_STEP;
        const exitEnd = exitAt + EXIT_DUR;
        const drift = DRIFT[rowIndex % 2] * exitEnd;

        // Horizontal-only blur, summed from the entry and exit envelopes; zero at rest.
        const blur = { enter: ENTER_BLUR, exit: 0 };
        let lastBlur = "";
        const applyBlur = () => {
          const value = (blur.enter + blur.exit).toFixed(2) + " 0";
          if (value !== lastBlur) {
            blurNode.setAttribute("stdDeviation", value);
            lastBlur = value;
          }
        };

        // Constant stream underneath, so a landed row never stops dead.
        tl.fromTo(row, { x: -dir * drift }, { x: 0, duration: exitEnd, ease: "none" }, 0);

        // Flood in from its edge.
        tl.fromTo(strip, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, enterAt);
        tl.fromTo(
          strip,
          { x: -dir * ENTER_DIST },
          { x: 0, duration: ENTER_DUR, ease: park()(ENTER_DUR) },
          enterAt,
        );
        tl.fromTo(
          blur,
          { enter: ENTER_BLUR },
          { enter: 0, duration: ENTER_DUR, ease: park()(ENTER_DUR), onUpdate: applyBlur },
          enterAt,
        );

        // Accelerate off its edge and be gone.
        tl.fromTo(
          strip,
          { x: 0 },
          { x: dir * EXIT_DIST, duration: EXIT_DUR, ease: "power3.in", immediateRender: false },
          exitAt,
        );
        tl.fromTo(
          blur,
          { exit: 0 },
          { exit: EXIT_BLUR, duration: EXIT_DUR, ease: "power3.in", immediateRender: false, onUpdate: applyBlur },
          exitAt,
        );
      });

      // Hero numeral: on screen with the settle, holds at 318, then counts down while it grows.
      const counter = document.getElementById(ID + "-counter");
      const START_VALUE = 318;
      const TARGET_VALUE = 8;
      const START_SCALE = 0.4; // ~22% of frame height against the ~55% final size
      const COUNT_AT = 1.0;
      const COUNT_DUR = 1.5;
      // k = 0.1 keeps digits ticking until one frame before the 2.5s beat.
      const COUNT_EASE = park(0.1)(COUNT_DUR);
      const state = { value: START_VALUE };
      let lastText = String(START_VALUE);

      tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
      tl.fromTo(
        state,
        { value: START_VALUE },
        {
          value: TARGET_VALUE,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: () => {
            const text = String(Math.round(state.value));
            if (text !== lastText) {
              counter.textContent = text;
              lastText = text;
            }
          },
        },
        COUNT_AT,
      );
      tl.fromTo(
        counter,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT,
      );

      // Label arrives per word; starts are computed once from the word list.
      const LABEL_AT = 2.75;
      const WORD_STEP = 0.125;
      const WORD_DUR = 0.3;
      let cumulative = 0;
      const WORD_TIMELINE = all("word").map((el) => {
        const start = LABEL_AT + cumulative;
        cumulative += WORD_STEP;
        return { el, start };
      });
      WORD_TIMELINE.forEach(({ el, start }) => {
        tl.fromTo(
          el,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: WORD_DUR, ease: park()(WORD_DUR) },
          start,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
