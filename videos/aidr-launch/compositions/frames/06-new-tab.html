        const W = 1920;
        const H = 1080;
        const DUR = 6;

        // Parking ease (film sheet): each frame covers ~15% of the remaining distance.
        const park = (k = 0.15, fps = 30) => (dur) => (p) =>
          (1 - Math.pow(1 - k, p * dur * fps)) / (1 - Math.pow(1 - k, dur * fps));

        // Directional blur writer: sets the filter's stdDeviation and drops the
        // filter entirely at rest so settled text rasterises crisp.
        const blurWriter = (el, filterId, axis) => {
          const node = root.querySelector("#" + filterId + " feGaussianBlur");
          return (v) => {
            if (v < 0.05) {
              el.style.filter = "none";
              return;
            }
            node.setAttribute("stdDeviation", axis === "y" ? "0 " + v : v + " 0");
            el.style.filter = "url(#" + filterId + ")";
          };
        };

        // Virtual camera (viewport-change, single wrapper): the focus point
        // (fx, fy) in world space maps to the viewport centre, T = -offset × S.
        // fy is composed from two overlapping moves (fa: aim up at row 1,
        // fb: glide down to row 4) so the push and the glide read as one move.
        const cam = { s: 1, fx: W / 2, fa: 0, fb: 0 };
        const applyCamera = () => {
          const fy = H / 2 + cam.fa + cam.fb;
          const x = -(cam.fx - W / 2) * cam.s;
          const y = -(fy - H / 2) * cam.s;
          world.style.transform = "translate(" + x + "px, " + y + "px) scale(" + cam.s + ")";

        seq.fromTo(push, { scale: 1 }, { scale: 1.02, duration: DUR, ease: "none" }, 0);

        // Scene 1 (0.0–1.2s): the window rises from below, vertical blur, lands by 0.8s.
        const RISE = 0.8;
        seq.fromTo(
          win,
          { y: 220, opacity: 0 },
          { y: 0, opacity: 1, duration: RISE, ease: park()(RISE) },
          0,
        );
        const winBlur = { v: 20 };
        const writeWinBlur = blurWriter(win, "f06-blur-win", "y");
        seq.fromTo(
          winBlur,
          { v: 20 },
          { v: 0, duration: RISE, ease: park()(RISE), onUpdate: () => writeWinBlur(winBlur.v) },
          0,
        );
        writeWinBlur(winBlur.v);

        // (No push-in on the card: frame 4 already showed it large. The shot goes straight to the
        // wide framing so the six channels can be named one by one with the voice.)

        // Scene 2 (0.7s): settle to the full window shifted left (75/25) as soon as it has landed.
        seq.to(
          cam,
          {
            s: 0.9,
            fx: 1220,
            fa: 0,
            fb: 0,
            duration: 0.75,
            ease: park()(0.75),
            onUpdate: applyCamera,
          },
          0.7,
        );

        // The channel count lands first, then the six chips tick in, 40px from the right, horizontal blur.
        seq.fromTo(".f06-count", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: park()(0.45) }, 0.7);
        const CHIP = 0.45;
        chips.forEach((chip, i) => {
          // Each chip lands as the voice names it (authored seconds; line 6 starts 0.7s into the shot).
          const at = [1.83, 2.43, 3.11, 3.82, 4.54, 5.39][i] - 0.15;
          const blur = { v: 9 };
          const write = blurWriter(chip, "f06-blur-chip-" + i, "x");
          seq.fromTo(
            chip,
            { x: 40, opacity: 0 },
            { x: 0, opacity: 1, duration: CHIP, ease: park()(CHIP) },
            at,
          );
          seq.fromTo(
            blur,
            { v: 9 },
            {
              v: 0,
              duration: CHIP,
              ease: park()(CHIP),
              immediateRender: false,
              onUpdate: () => write(blur.v),
            },
            at,
          );
        });

        // Scene 4 (5.0–6.0s): hold — only the root push keeps moving.

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
      tl.add(seq.timeScale(10 / 9), 0);
      window.__timelines["06-new-tab"] = tl;
      })();
    </script>
  </div>
</template>
